<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order of Service Builder</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: #7BAE58;
    --brand-deep: #233617;
    --brand-mid: #4E7A35;
    --bg: #F3F8EF;
    --card: #FFFFFF;
    --ink: #1E2A16;
    --muted: #5B6A50;
    --line: #DCE7D3;
    --tint: #EFF6EA;
    --tint-line: #C6DBB6;
    --danger: #B3261E;
    --warn-bg: #FFF2CC;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 'Poppins', system-ui, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }

  /* ---------- Top bar ---------- */
  .bar {
    position: sticky; top: 0; z-index: 5;
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
    padding: 10px 18px;
    background: var(--brand-deep); color: #fff;
  }
  .bar h1 { margin: 0 8px 0 0; font-size: 16px; font-weight: 600; }
  .bar #layout { min-width: 0; }
  .bar select { min-height: 36px; border-radius: 8px; border: 0; padding: 0 10px; color: var(--ink); min-width: 260px; }
  .bar input[type=date] { min-height: 36px; border-radius: 8px; border: 0; padding: 0 10px; color: var(--ink); font: inherit; }
  .bar .spacer { flex: 1; }
  .bar .status { font-size: 13px; color: #CFE3C0; }
  .bar .status.dirty { color: #FFE7A3; }
  .btn { min-height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--tint-line); background: var(--card); color: var(--ink); font-weight: 500; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #10160C; }
  .btn.small { min-height: 30px; padding: 0 10px; font-size: 13px; }
  .btn:disabled { opacity: .6; cursor: default; }
  .bar .btn { border-color: transparent; }
  .bar a.btn { display: inline-flex; align-items: center; text-decoration: none; }
  .bar a.help { color: #CFE3C0; font-size: 13px; }

  /* ---------- Layout ---------- */
  .layout { display: grid; grid-template-columns: minmax(420px, 1fr) minmax(360px, 560px); gap: 18px; padding: 18px; align-items: start; }
  @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 16px; overflow: hidden; }
  .panel-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 14px; background: var(--tint); border-bottom: 1px solid var(--line); }
  .panel-head h2 { margin: 0; font-size: 15px; font-weight: 600; flex: 1; }
  .panel-head .sub { font-size: 12px; color: var(--muted); width: 100%; }
  .panel-body { padding: 10px 12px 12px; }
  .msg { margin: 0 0 16px; padding: 10px 14px; border-radius: 10px; background: var(--warn-bg); font-size: 13px; }
  .msg.error { background: #FCE4E4; color: var(--danger); }

  /* ---------- Items ---------- */
  .items { list-style: none; margin: 0; padding: 0; }
  .item { display: grid; grid-template-columns: 22px 1fr auto; gap: 4px 8px; align-items: center; padding: 6px 6px 6px 2px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 6px; background: var(--card); }
  .item.off { opacity: .45; }
  /* Where a dragged item will land: one line centered in the gap between two items. */
  .item { position: relative; }
  .item.drop-before::before, .item.drop-end::after { content: ''; position: absolute; left: 4px; right: 4px; height: 3px; border-radius: 2px; background: var(--brand); pointer-events: none; }
  .item.drop-before::before { top: -5.5px; }
  .item.drop-end::after { bottom: -5.5px; }
  .item.dragging { opacity: .3; }
  .handle { grid-row: span 2; align-self: stretch; display: flex; align-items: center; justify-content: center; cursor: grab; color: #9aa59a; font-size: 16px; user-select: none; }
  .row1, .row2 { display: flex; gap: 6px; min-width: 0; }
  .item input { min-width: 0; height: 30px; border: 1px solid var(--line); border-radius: 7px; padding: 0 8px; background: #fff; font-size: 13px; }
  .item input:focus { outline: 2px solid var(--brand); outline-offset: 0; border-color: transparent; }
  .item .label { flex: 0 0 34%; font-weight: 600; }
  .item .note { flex: 1; }
  .item .value { flex: 1; }
  .item .verses { flex: 0 0 90px; }
  .item .value.linked::placeholder { color: var(--ink); opacity: .55; }
  .tools { grid-row: span 2; display: flex; flex-direction: column; gap: 4px; }
  .icon { width: 30px; height: 28px; border: 1px solid var(--line); border-radius: 7px; background: #fff; color: var(--muted); font-size: 13px; line-height: 1; }
  .icon:hover { border-color: var(--tint-line); color: var(--ink); }
  .from { font-size: 11px; color: var(--brand-mid); white-space: nowrap; align-self: center; }
  .add-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  .add-row select { height: 32px; border-radius: 8px; border: 1px solid var(--tint-line); padding: 0 8px; background: #fff; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 13px; }
  .opts label { display: inline-flex; gap: 6px; align-items: center; }
  .team { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .team h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; }
  .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 6px 10px; }
  .team label { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--muted); }
  .team label.wide { grid-column: 1 / -1; }
  .team input { height: 30px; border: 1px solid var(--line); border-radius: 7px; padding: 0 8px; font: inherit; font-size: 13px; color: var(--ink); }
  .cancel-toggle { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 500; }
  .panel.is-off .panel-head { background: #FCE4E4; }
  .reason { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); max-width: 420px; }
  .reason input { height: 32px; border: 1px solid var(--line); border-radius: 7px; padding: 0 8px; font: inherit; font-size: 14px; color: var(--ink); }
  .hint { margin: 8px 0 0; font-size: 12px; color: var(--muted); }
  .email-panel .reason { max-width: none; }
  .email-panel textarea { width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; font: inherit; font-size: 14px; color: var(--ink); resize: vertical; }
  .opts input[type=text] { height: 30px; border: 1px solid var(--line); border-radius: 7px; padding: 0 8px; width: 170px; }

  /* ---------- Preview ---------- */
  .preview { position: sticky; top: 74px; }
  .preview-head { display: flex; align-items: center; justify-content: space-between; margin: 0 2px 8px; font-size: 13px; color: var(--muted); }
  .fit-warn { color: var(--danger); font-weight: 500; }
  .paper-wrap { background: #d9dfd5; border-radius: 12px; padding: 14px; overflow: hidden; }
  .paper-scale { transform-origin: top left; }
  .paper { width: fit-content; height: fit-content; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.15); }

  /* ---------- The half sheet (screen preview and print) ---------- */
  .half { width: 5.5in; height: 8.5in; padding: 0.38in 0.42in 0.3in; display: flex; flex-direction: column; color: #000; font-family: 'Source Sans 3', 'Segoe UI', sans-serif; }
  .half-body { flex: 1; min-height: 0; overflow: hidden; font-size: calc(10.5pt * var(--s, 1)); line-height: 1.32; }
  .svc + .svc { margin-top: 1.05em; }
  .svc-hd { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; border-bottom: 1.5pt solid #000; padding-bottom: .15em; margin-bottom: .35em; }
  .svc-hd b { font-size: 1.45em; font-weight: 700; letter-spacing: .005em; }
  .svc-hd span { font-size: .9em; font-weight: 600; color: #333; text-align: right; }
  .off-note { font-style: italic; }
  .lead { font-weight: 700; font-size: .8em; margin: -.05em 0 .35em; }  /* same size as the team credits */
  .ln { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: .07em 0; }
  .ln .l { color: #333; }
  .ln .l i { color: #000; }
  .ln .r { text-align: right; }
  .song { font-weight: 700; font-style: italic; }
  .num { display: inline-block; min-width: 1.7em; padding: 0 .25em; margin-right: .3em; border: .6pt solid #555; border-radius: 3px; font-style: normal; font-weight: 600; font-size: .85em; text-align: center; line-height: 1.3; }
  .new { display: inline-block; padding: 0 .25em; margin-right: .3em; border: .6pt solid #000; border-radius: 3px; font-style: normal; font-weight: 700; font-size: .72em; letter-spacing: .04em; vertical-align: .1em; }
  .vv { font-style: normal; font-weight: 400; color: #555; font-size: .85em; margin-left: .2em; }
  /* Team credits: label, name, label, name. The labels get a fixed width (sized to
     E. GUITAR and SOPRANO) so names line up across groups and services. */
  .credits {
    display: grid; grid-template-columns: 3.95em minmax(0, 1fr) 3.95em minmax(0, 1fr);
    column-gap: .5em; row-gap: .05em; margin-top: 1.2em;
    font-size: .8em; line-height: 1.3;
  }
  .cg-h { grid-column: 1 / -1; font-size: .78em; font-weight: 700; letter-spacing: .1em; margin: .35em 0 .1em; border-bottom: .4pt solid #bbb; }
  .cg-h:first-child { margin-top: 0; }
  .credits .k { text-align: right; color: #555; font-size: .82em; text-transform: uppercase; letter-spacing: .06em; padding-top: .1em; white-space: nowrap; }
  .credits .k2 { padding-left: 0; }
  .half-foot { display: flex; justify-content: center; padding-top: .12in; }
  .half-foot img { height: 0.42in; filter: brightness(0); }

  /* Third sheet: 3 2/3 x 8 1/2 in, three across the page */
  .half.third { width: 3.6667in; padding: 0.3in 0.24in 0.22in; }
  .half.third .half-body { font-size: calc(9.5pt * var(--s, 1)); line-height: 1.25; }
  .half.third .svc-hd { display: block; }
  .half.third .svc-hd span { display: block; text-align: left; font-size: .8em; }
  .half.third .ln { gap: 6px; }
  .half.third .ln .l { flex: 0 1 auto; }
  .half.third .credits { column-gap: .35em; }
  .half.third .credits .k2 { padding-left: 0; }
  .half.third .half-foot { padding-top: .08in; }
  .half.third .half-foot img { height: 0.32in; }

  /* Sixth sheet (Wednesday): 3 2/3 x 4 1/4 in, three across and two down. Uses the third-sheet rules too. */
  .half.sixth { height: 4.25in; padding: 0.2in 0.24in 0.14in; }
  .half.sixth .half-body { font-size: calc(9pt * var(--s, 1)); }
  .half.sixth .half-foot { padding-top: .05in; }
  .half.sixth .half-foot img { height: 0.24in; }

  /* Wednesday sheets are short, so they get a bigger date and logo, and one credit per line
     with no indent (no singers, so the labels don't need room for SOPRANO). */
  .half.wed .svc-hd span { font-size: 1.05em; }
  .half.wed .lead { font-size: .92em; }
  .half.wed .credits { grid-template-columns: max-content minmax(0, 1fr); font-size: .92em; }
  .half.wed .credits .k { text-align: left; }
  .half.wed .credits span:empty { display: none; }
  .half.wed .half-foot img { height: 0.84in; }
  .half.third.wed .half-foot img { height: 0.64in; }
  .half.sixth.wed .half-foot img { height: 0.48in; }

  /* ---------- Print: two copies side by side on letter landscape ---------- */
  #printArea { display: none; }
  @page { size: letter landscape; margin: 0; }
  @media print {
    body { background: #fff; }
    body > *:not(#printArea) { display: none !important; }
    #printArea { display: flex !important; flex-wrap: wrap; align-content: flex-start; width: 11in; height: 8.5in; }
    #printArea .half { break-inside: avoid; }
  }

  dialog { border: 0; border-radius: 14px; padding: 20px; width: min(360px, 92vw); box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(16, 22, 12, .5); }
  dialog h3 { margin: 0 0 6px; font-size: 16px; }
  dialog p { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
  dialog input { width: 100%; height: 40px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; font-size: 16px; letter-spacing: .15em; }
  dialog .err { color: var(--danger); font-size: 13px; min-height: 18px; margin: 6px 0 0; }
  dialog .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
</style>
</head>
<body>
  <div class="bar">
    <h1>Order of Service</h1>
    <select id="date" aria-label="Date"></select>
    <input type="date" id="customDate" aria-label="Date for the custom sheet" hidden>
    <select id="layout" aria-label="Sheet size">
      <option value="third">3 per page (third sheet)</option>
      <option value="half">2 per page (half sheet)</option>
      <option value="sixth">6 per page (Wednesday)</option>
    </select>
    <span class="spacer"></span>
    <span class="status" id="status"></span>
    <button type="button" class="btn" id="saveBtn">Save</button>
    <button type="button" class="btn" id="pdfBtn" title="Saves one copy at its own size into Orders of Service in Drive, for the team email">Save PDF</button>
    <button type="button" class="btn primary" id="printBtn">Print</button>
    <a class="btn" id="packetLink" href="packet.html" title="Pick the song PDFs and combine them into one">Song packet</a>
    <a class="help" href="leader-guide.html" target="_blank" rel="noopener">Help</a>
  </div>

  <div class="layout">
    <div>
      <div id="notice"></div>
      <div id="editor"></div>
    </div>
    <div class="preview">
      <div class="preview-head"><span id="printNote"></span><span id="fit"></span></div>
      <div class="paper-wrap" id="paperWrap"><div class="paper-scale" id="paperScale"><div class="paper"><div class="half" id="half"></div></div></div></div>
    </div>
  </div>

  <div id="printArea"></div>

  <dialog id="codeDialog">
    <form method="dialog" id="codeForm">
      <h3>Enter your code</h3>
      <p>Saving changes the Orders tab in the Music Schedule Sheet. The code is in Apps Script (see SETUP.md). This computer remembers it.</p>
      <input id="codeInput" inputmode="numeric" autocomplete="off" aria-label="Code">
      <p class="err" id="codeErr"></p>
      <div class="btns"><button type="button" class="btn" id="codeCancel">Cancel</button><button class="btn primary" id="codeOk">Save</button></div>
    </form>
  </dialog>

<script>
  // Same Apps Script web app as the volunteer page.
  const API_URL = 'https://script.google.com/macros/s/AKfycbyN_FOd4twDKmMrDk5l3NqTmKRJrKhIC3kUgkuumCKGoxK_wlkFxZlWevtGUyPtSnPE8Q/exec';
  const CODE_KEY = 'gbc-oos-code';
  const EMAIL_LINK_KEY = 'gbc-oos-email-link';   // the email helper's web app link, with its key
  const CHOIR_LEADER = 'Kevin Plew';
  const DRAFT_PREFIX = 'gbc-oos-draft|';
  const LAYOUT_KEY = 'gbc-oos-layout';
  const LAYOUTS = {
    half: { width: 5.5, height: 8.5, copies: 2, min: 0.7, cls: '', note: 'two across' },
    third: { width: 11 / 3, height: 8.5, copies: 3, min: 0.6, cls: ' third', note: 'three across' },
    sixth: { width: 11 / 3, height: 4.25, copies: 6, min: 0.6, cls: ' third sixth', note: 'six (three across, two down)' },
  };
  // Wednesday sheets remember their own size, starting at 6 per page; everything else starts at 3.
  const isWednesdaySheet = () => sheet.length > 0 && sheet.every((p) => p.svc.service === 'Wednesday');
  const layoutKey = () => LAYOUT_KEY + (isWednesdaySheet() ? '|wed' : '');
  const savedLayout = () => { const v = store((s) => s.getItem(layoutKey())); return LAYOUTS[v] ? v : (isWednesdaySheet() ? 'sixth' : 'third'); };
  let layout = 'third';
  const PASTOR = 'Pastor Daniel Stevens';

  const SERVICES = ['Sunday AM', 'Sunday PM', 'Wednesday'];
  const SERVICE_LABEL = { 'Sunday AM': 'Sunday Morning', 'Sunday PM': 'Sunday Evening', 'Wednesday': 'Wednesday Evening' };
  const CANCELLED = /cancel|^\s*no\b.*\bservice/i;
  // Services the builder can cancel. Save writes "No Service – reason" to the Sheet's Service Notes row.
  const CANCELLABLE = ['Sunday PM'];
  const CANCEL_PREFIX = /^\s*(cancel+ed|no\b.*?\bservice)\s*(?:[–—:-]\s*)?/i;

  // ---------- Default orders (until you save your own with "Make this the default") ----------
  const text = (label, more) => Object.assign({ kind: 'text', label, note: '', value: '', verses: '', source: '', hidden: false, italic: false }, more);
  const song = (label, source) => text(label, { kind: 'song', source });
  const DEFAULT_ORDERS = {
    'Sunday AM': [
      text('Prelude', { source: 'Prelude' }),
      text('Announcement Video', { value: 'Media Booth' }),
      song('Hymn', 'Song 1'),
      song('Hymn', 'Song 2'),
      text('Scripture Reading'),
      text('Offering', { source: 'Offering', italic: true }),
      song('Hymn', 'Song 3'),
      song('Hymn', 'Song 4'),
      song('Hymn', 'Song 5'),
      text('Special', { source: 'Special', italic: true }),
      text('Message', { value: PASTOR }),
      song('Closing', 'Closing'),
    ],
    'Sunday PM': [
      text('Prelude', { source: 'Prelude' }),
      song('Hymn', 'Song 1'),
      text('Announcements / Prayer'),
      song('Hymn', 'Song 2'),
      song('Hymn', 'Song 3'),
      text('Sermon', { value: PASTOR }),
      song('Closing Hymn', 'Closing'),
    ],
    'Wednesday': [
      song('Hymn', 'Song 1'),
      text('Announcements / Prayer', { source: 'Song Leading' }),
      song('Hymn', 'Song 2'),
      song('Hymn', 'Song 3'),
      text('Bible Study', { value: PASTOR }),
    ],
  };
  DEFAULT_ORDERS['One-time'] = DEFAULT_ORDERS['Sunday AM'];

  // "Add" menu
  const PRESETS = {
    'Hymn': () => song('Hymn', ''),
    'Special Song': () => text('Special', { italic: true }),
    'Choir': () => text('Choir', { italic: true, value: CHOIR_LEADER }),
    'Missionary Presentation': () => text('Missionary Presentation'),
    'Scripture Reading': () => text('Scripture Reading'),
    'Message': () => text('Message', { value: PASTOR }),
    'Communion': () => text('Communion', { value: PASTOR }),
    'Announcements': () => text('Announcements'),
    'Prayer': () => text('Prayer'),
    'Offering': () => text('Offering', { source: 'Offering', italic: true }),
    'Baptism': () => text('Baptism'),
    'Something else': () => text('New item'),
  };

  // Team credits: [schedule role, printed label]
  const MUSIC = [['Leading', 'Leader'], ['Song Leading', 'Leader'], ['Piano', 'Piano'], ['Synth', 'Synth'], ['Strings', 'Strings'],
    ['Guitar', 'Guitar'], ['Electric Guitar', 'E. Guitar'], ['Bass Guitar', 'Bass']];
  const SINGER_ROWS = [['Soprano', 'Tenor'], ['Alto', 'Bass'], ['Alt (Women)', 'Alt (Men)']];
  const SINGER_LABEL = { 'Alt (Women)': 'Alt', 'Alt (Men)': 'Alt' };
  const MEDIA = [['Slides', 'Slides'], ['House Audio', 'House'], ['Livestream Audio', 'Stream'], ['Video Mixer', 'Video']];

  const $ = (sel) => document.querySelector(sel);
  let services = [];
  let saved = { orders: {}, templates: {} };
  let sheet = [];      // [{ svc, key, order, dirty }] for the chosen date
  let cancelled = [];  // services on the chosen date that are cancelled
  let uid = 0;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function store(fn) { try { return fn(window.localStorage); } catch (e) { return null; } }
  const clone = (x) => JSON.parse(JSON.stringify(x));
  function parseDate(key) { const [y, m, d] = key.split('-').map(Number); return new Date(y, m - 1, d); }
  const fmt = (key, opts) => parseDate(key).toLocaleDateString('en-US', opts);

  // ---------- Schedule data ----------
  const roleValue = (svc, role) => ((svc.items.find((it) => it.role === role) || {}).value || '');
  const serviceNote = (svc) => roleValue(svc, 'Service Notes');
  const templateType = (svc) => (SERVICES.includes(svc.service) ? svc.service : 'One-time');
  const isCancelled = (svc) => CANCELLED.test(serviceNote(svc));

  // The Service Notes text a sheet uses: a custom sheet's own, a change waiting for Save, or the Sheet's.
  function noteOf(part) {
    if (part.custom) return part.order.team['Service Notes'] || '';
    return part.order.pendingNote !== undefined ? part.order.pendingNote : serviceNote(part.svc);
  }
  const partOff = (part) => CANCELLED.test(noteOf(part));
  // "No Service – Thanksgiving Dinner" -> "Thanksgiving Dinner"
  function cancelReason(note) {
    const m = CANCEL_PREFIX.exec(note || '');
    return m ? note.slice(m[0].length) : (note || '');
  }
  // Keeps the note's own wording ("Cancelled", "No Regular Evening Service") when there is one.
  function cancelNote(reason, oldNote) {
    const m = CANCEL_PREFIX.exec(oldNote || '');
    const prefix = m ? m[1] : 'No Service';
    return reason.trim() ? prefix + ' – ' + reason.trim() : prefix;
  }
  function setNote(part, note) {
    if (part.custom) {
      part.order.team['Service Notes'] = note;
      part.svc = customSvc(part.svc.date, part.svc.service, part.order.team);
    } else if (note === serviceNote(part.svc)) delete part.order.pendingNote;
    else part.order.pendingNote = note;
  }
  // After Save, so the sheet matches the Sheet without reloading.
  function setSheetNote(svc, note) {
    const it = svc.items.find((x) => x.role === 'Service Notes');
    if (it && note) it.value = note;
    else if (it) svc.items.splice(svc.items.indexOf(it), 1);
    else if (note) svc.items.unshift({ section: '', role: 'Service Notes', value: note });
  }

  // "43 Rejoice the Lord Is King", "*New* I Set My Hope on Jesus"
  function parseSong(textValue) {
    let t = String(textValue || '').trim();
    const isNew = /^\*?\s*new\s*\*?\s*/i.test(t);
    if (isNew) t = t.replace(/^\*?\s*new\s*\*?\s*/i, '');
    const m = /^(\d{1,4})\s+(.+)$/.exec(t);
    return { isNew, num: m ? m[1] : '', title: m ? m[2] : t };
  }

  // Special, Choir, and Offering details are song titles, so they print in italics. Offering is matched by
  // name too, so sheets and defaults saved before it was italic get it as well.
  const noteItalic = (it) => it.italic || /^offering\b/i.test(String(it.label || '').trim());
  const shown = (item, svc) => item.value || (item.source ? roleValue(svc, item.source) : '');
  // Linked items with nothing on the schedule (an empty Song 5) are left off the sheet.
  const prints = (item, svc) => !item.hidden && !(item.source && !shown(item, svc));

  // ---------- Custom sheets (not linked to the schedule) ----------
  // A custom Sunday has a morning and an evening service, like a regular Sunday sheet.
  const CUSTOM_KINDS = { Sunday: ['Sunday AM', 'Sunday PM'], Wednesday: ['Wednesday'] };
  // Each custom service's team: [schedule role, label in the editor]. The credits and linked
  // items (Prelude, Announcements / Prayer) read these the same way they read the Sheet.
  const TEAM = {
    'Sunday AM': [['Leading', 'Music Leader'], ['Prelude', 'Prelude'], ['Piano', 'Piano'], ['Synth', 'Synth'], ['Strings', 'Strings'],
      ['Guitar', 'Guitar'], ['Electric Guitar', 'Electric Guitar'], ['Bass Guitar', 'Bass Guitar'],
      ['Soprano', 'Soprano'], ['Alto', 'Alto'], ['Tenor', 'Tenor'], ['Bass', 'Bass'], ['Alt (Women)', 'Alt (Women)'], ['Alt (Men)', 'Alt (Men)'],
      ['Slides', 'Slides'], ['House Audio', 'House Audio'], ['Livestream Audio', 'Livestream Audio'], ['Video Mixer', 'Video Mixer']],
    'Sunday PM': [['Leading', 'Music Leader'], ['Prelude', 'Prelude'], ['Piano', 'Piano'], ['Synth', 'Synth'],
      ['Slides', 'Slides'], ['House Audio', 'House Audio'], ['Video Mixer', 'Video Mixer']],
    'Wednesday': [['Song Leading', 'Song Leader'], ['Piano', 'Piano'], ['House Audio', 'House Audio'], ['Video Mixer', 'Video Mixer']],
  };
  // Saved as "2026-10-14|Custom Wednesday" on the Orders tab.
  const CUSTOM_KEY = /^(\d{4}-\d{2}-\d{2})\|Custom (Sunday AM|Sunday PM|Wednesday)$/;
  const customKey = (date, service) => date + '|Custom ' + service;
  const kindOf = (service) => (service === 'Wednesday' ? 'Wednesday' : 'Sunday');
  const isTeamRole = (svc, role) => (TEAM[svc.service] || []).some(([r]) => r === role);
  let custom = null;   // { kind, date } while a custom sheet is open

  function customSvc(date, service, team) {
    return { date, service, custom: true,
      items: Object.keys(team).filter((role) => team[role]).map((role) => ({ section: '', role, value: team[role] })) };
  }

  const dateKey = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  // The coming Sunday or Wednesday (today, if it's that day).
  function nextDay(kind) {
    const d = new Date(); d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() + (((kind === 'Wednesday' ? 3 : 0) - d.getDay() + 7) % 7));
    return dateKey(d);
  }

  function chooseCustom(kind, date) {
    custom = { kind, date };
    cancelled = [];
    $('#customDate').hidden = false;
    $('#customDate').value = date;
    sheet = CUSTOM_KINDS[kind].map((service) => {
      const key = customKey(date, service);
      const part = Object.assign({ key, custom: true }, loadOrder({ date, service, items: [] }, key));
      part.order.team = part.order.team || {};
      part.svc = customSvc(date, service, part.order.team);
      return part;
    });
    showLayout(savedLayout());
    renderEditor();
    renderPreview();
    renderStatus();
  }

  // Changing a custom sheet's date moves it; the copy saved under the old date is removed on Save.
  $('#customDate').onchange = () => {
    const date = $('#customDate').value;
    if (!custom || !date || date === custom.date) return;
    custom.date = date;
    sheet.forEach((part) => {
      store((s) => s.removeItem(DRAFT_PREFIX + part.key));
      if (!part.moveFrom && saved.orders[part.key]) part.moveFrom = part.key;
      part.key = customKey(date, part.svc.service);
      part.svc.date = date;
      changed(part);
    });
    renderDates();
  };

  function openChoice(v) {
    const [a, b, c] = v.split('|');
    if (a === 'new') chooseCustom(b, nextDay(b));
    else if (a === 'custom') chooseCustom(c, b);
    else chooseDate(v);
  }

  // ---------- Building a sheet for a date ----------
  function freshOrder(svc) {
    const type = templateType(svc);
    const items = clone((saved.templates[type] && saved.templates[type].items) || DEFAULT_ORDERS[type]);
    items.forEach((it) => { it.id = ++uid; });
    return { items, leader: '', credits: true };
  }

  function loadOrder(svc, key) {
    const fromSheet = saved.orders[key];
    const draft = JSON.parse(store((s) => s.getItem(DRAFT_PREFIX + key)) || 'null');
    let order, dirty = false;
    if (draft && (!fromSheet || (draft.at || 0) > (fromSheet.savedAt || 0))) { order = draft.order; dirty = true; }
    else if (fromSheet) order = clone(fromSheet);
    else order = freshOrder(svc);
    order.items.forEach((it) => { it.id = ++uid; });
    return { order, dirty };
  }

  function chooseDate(dateKey) {
    custom = null;
    $('#customDate').hidden = true;
    const onDate = services.filter((s) => s.date === dateKey);
    cancelled = onDate.filter((s) => isCancelled(s) && !CANCELLABLE.includes(s.service));
    sheet = onDate.filter((s) => !cancelled.includes(s)).map((svc) => {
      const key = svc.date + '|' + svc.service;
      return Object.assign({ svc, key }, loadOrder(svc, key));
    });
    showLayout(savedLayout());
    renderEditor();
    renderPreview();
    renderStatus();
  }

  function renderDates() {
    const dates = [...new Set(services.map((s) => s.date))];
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const current = $('#date').value;
    $('#date').innerHTML = dates.map((d) => {
      const names = services.filter((s) => s.date === d).map((s) => s.service).join(', ');
      const done = services.some((s) => s.date === d && saved.orders[d + '|' + s.service]);
      return '<option value="' + d + '">' + esc(fmt(d, { weekday: 'short', month: 'short', day: 'numeric' })) + ' · ' + esc(names) + (done ? '  ✓ saved' : '') + '</option>';
    }).join('');
    // Custom sheets that are saved, or started on this computer, from two weeks back on.
    const from = new Date(today); from.setDate(from.getDate() - 14);
    const customs = new Map();   // "date|kind" -> saved?
    const note = (key, isSaved) => {
      const m = CUSTOM_KEY.exec(key);
      if (!m || parseDate(m[1]) < from) return;
      const k = m[1] + '|' + kindOf(m[2]);
      customs.set(k, customs.get(k) || isSaved);
    };
    Object.keys(saved.orders).forEach((k) => note(k, true));
    store((s) => Object.keys(s).forEach((k) => { if (k.startsWith(DRAFT_PREFIX)) note(k.slice(DRAFT_PREFIX.length), false); }));
    $('#date').innerHTML += '<optgroup label="Custom (not from the schedule)">' +
      '<option value="new|Sunday">New custom Sunday…</option><option value="new|Wednesday">New custom Wednesday…</option>' +
      [...customs].sort().map(([k, isSaved]) => {
        const [d, kind] = k.split('|');
        return '<option value="custom|' + esc(k) + '">' + esc(fmt(d, { weekday: 'short', month: 'short', day: 'numeric' })) + ' · Custom ' + kind +
          (isSaved ? '  ✓ saved' : '  (not saved)') + '</option>';
      }).join('') + '</optgroup>';
    const values = [...$('#date').options].map((o) => o.value);
    const firstUpcoming = dates.find((d) => parseDate(d) >= today) || dates[0] || 'new|Sunday';
    const open = custom && 'custom|' + custom.date + '|' + custom.kind;
    const want = custom ? (values.includes(open) ? open : 'new|' + custom.kind) : current;
    $('#date').value = values.includes(want) ? want : firstUpcoming;
  }

  // ---------- Editor ----------
  function renderEditor() {
    $('#notice').innerHTML = cancelled.map((svc) =>
      '<p class="msg">' + esc(SERVICE_LABEL[svc.service] || svc.service) + ' is cancelled (' + esc(serviceNote(svc)) + '), so it’s left off the sheet.</p>').join('');
    if (!sheet.length) {
      $('#editor').innerHTML = '<p class="msg">There’s no service to print on this date.</p>';
      return;
    }
    $('#editor').innerHTML = sheet.map((part, p) => {
      const svc = part.svc;
      const needsLeader = !part.custom && !roleValue(svc, 'Leading') && !roleValue(svc, 'Song Leading');
      const canCancel = CANCELLABLE.includes(svc.service);
      const off = canCancel && partOff(part);
      const toggle = canCancel ? '<label class="cancel-toggle"><input type="checkbox" data-act="cancel"' + (off ? ' checked' : '') + '> Cancelled</label>' : '';
      if (off) {
        return '<section class="panel is-off" data-p="' + p + '">' +
          '<div class="panel-head"><h2>' + esc(SERVICE_LABEL[svc.service] || svc.service) + (part.custom ? ' (custom)' : '') + '</h2>' + toggle +
          '<span class="sub">This service is cancelled. Uncheck Cancelled to bring it back; its order is kept.</span></div>' +
          '<div class="panel-body"><label class="reason">Reason (optional)<input type="text" data-act="reason" value="' + esc(cancelReason(noteOf(part))) + '" placeholder="Thanksgiving Dinner"></label>' +
          '<p class="hint">The sheet shows “<span class="cancel-note">' + esc(noteOf(part)) + '</span>” in place of this service. ' +
          (part.custom ? '' : 'It’s the Service Notes row in the Sheet; Save writes your changes there.') + '</p></div></section>';
      }
      return '<section class="panel" data-p="' + p + '">' +
        '<div class="panel-head"><h2>' + esc(SERVICE_LABEL[svc.service] || svc.service) + (part.custom ? ' (custom)' : '') + '</h2>' + toggle +
        '<button type="button" class="btn small" data-act="default">Make this the default</button>' +
        '<button type="button" class="btn small" data-act="reset">Start over</button>' +
        '<span class="sub">' + (part.custom
          ? 'Not linked to the schedule. Type in the songs, and the team at the bottom; blank lines are left off. Drag ⠿ to reorder.'
          : 'Gray text comes from the schedule; type over it to change just this sheet. Drag ⠿ to reorder.') + '</span></div>' +
        '<div class="panel-body"><ol class="items">' + part.order.items.map((it, i) => itemRow(it, i, svc)).join('') + '</ol>' +
        '<div class="add-row"><select data-act="addType" aria-label="Item to add">' +
        Object.keys(PRESETS).map((k) => '<option>' + esc(k) + '</option>').join('') +
        '</select><button type="button" class="btn small" data-act="add">Add</button></div>' +
        '<div class="opts"><label><input type="checkbox" data-act="credits"' + (part.order.credits !== false ? ' checked' : '') + '> Show team credits</label>' +
        (needsLeader ? '<label>Music leader <input type="text" data-act="leader" value="' + esc(part.order.leader || '') + '" placeholder="Name"></label>' : '') +
        '</div>' + (part.custom ? teamHtml(part) : '') + '</div></section>';
    }).join('') + emailHtml();
  }

  // ---------- Weekly team email ----------
  // The note and extra notes are saved with Sunday morning's order; the email helper
  // (EmailHelper.gs, in David's personal Google account) reads them when it makes the drafts.
  const emailPart = () => sheet.find((p) => p.svc.service === 'Sunday AM') || null;

  function emailHtml() {
    const part = emailPart();
    if (!part) return '';
    const email = part.order.email || {};
    return '<section class="panel email-panel">' +
      '<div class="panel-head"><h2>Team email</h2>' +
      '<button type="button" class="btn small" id="emailBtn">Make email drafts</button>' +
      '<button type="button" class="btn small" id="emailLinkBtn">Change email link</button>' +
      '<span class="sub">Make email drafts saves this Sunday, then makes the two Gmail drafts from it, with the PDFs attached ' +
      '(replacing any already made for this Sunday).</span></div>' +
      '<div class="panel-body">' +
      '<label class="reason">Personal note (goes after “Good afternoon,”)<textarea data-email="intro" rows="2" placeholder="Hope you’ve had a great week!">' + esc(email.intro || '') + '</textarea></label>' +
      '<label class="reason" style="margin-top:8px">Extra notes, one per line (added under Notes)<textarea data-email="notes" rows="3" placeholder="Kristen Baisley will play piano for the Lord’s Supper.">' + esc(email.notes || '') + '</textarea></label>' +
      '</div></section>';
  }

  // Asks for the email helper link and remembers it on this computer. Returns
  // the link, or '' if it was cancelled or doesn't look right.
  function askEmailLink(current) {
    const link = (prompt('Paste the email helper link (it comes from running builderLink in the helper; see SETUP.md, "Weekly song email"):', current || '') || '').trim();
    if (!link) return '';
    if (!/^https:\/\/script\.google\.com\/.+[?&]key=/.test(link)) { alert('That doesn’t look like the email helper link.'); return ''; }
    store((s) => s.setItem(EMAIL_LINK_KEY, link));
    return link;
  }

  async function makeEmailDrafts() {
    const link = store((s) => s.getItem(EMAIL_LINK_KEY)) || askEmailLink('');
    if (!link) return;
    const part = emailPart();
    if (!part) return;
    const win = window.open('about:blank', '_blank');   // opened now so the browser doesn't block it after saving
    if (sheet.some((p) => p.dirty)) {
      await save();
      if (sheet.some((p) => p.dirty)) { if (win) win.close(); return; }
    }
    const url = link + '&date=' + part.svc.date;
    if (win) win.location = url; else window.open(url, '_blank');
  }

  $('#editor').addEventListener('input', (e) => {
    const field = e.target.dataset && e.target.dataset.email;
    const part = field && emailPart();
    if (!part) return;
    part.order.email = Object.assign({}, part.order.email, { [field]: e.target.value });
    changed(part);
  });
  $('#editor').addEventListener('click', (e) => {
    if (e.target.id === 'emailBtn') makeEmailDrafts();
    if (e.target.id === 'emailLinkBtn') {
      const before = store((s) => s.getItem(EMAIL_LINK_KEY)) || '';
      const link = askEmailLink(before);
      if (link && link !== before) flashStatus('Email link saved on this computer.');
    }
  });

  function teamHtml(part) {
    const team = part.order.team;
    const field = (role, label, cls, ph) => '<label' + (cls ? ' class="' + cls + '"' : '') + '>' + esc(label) +
      '<input type="text" data-team="' + esc(role) + '" value="' + esc(team[role] || '') + '"' + (ph ? ' placeholder="' + esc(ph) + '"' : '') + '></label>';
    return '<div class="team"><h3>Team</h3><div class="team-grid">' +
      field('Service Notes', 'Service note (optional, prints next to the date)', 'wide', 'Lord’s Supper') +
      TEAM[part.svc.service].map(([role, label]) => field(role, label)).join('') + '</div></div>';
  }

  // What a linked item shows when nothing is typed in it.
  function placeholderFor(it, svc) {
    if (!it.source) return it.kind === 'song' ? 'Song' : 'Name';
    const v = roleValue(svc, it.source);
    if (!svc.custom) return v || 'Not on the schedule (left off)';
    if (isTeamRole(svc, it.source)) return v || 'From the team (left off if blank)';
    return it.kind === 'song' ? 'Song (left off if blank)' : 'Left off if blank';
  }
  // The small tag after a linked item: "from Song 1", "from Team", or "changed".
  function fromText(it, svc) {
    if (!it.source || (svc.custom && !isTeamRole(svc, it.source))) return '';
    return it.value ? 'changed' : 'from ' + (svc.custom ? 'Team' : it.source);
  }
  const looksLinked = (it, svc) => !!it.source && !it.value && (!svc.custom || isTeamRole(svc, it.source));

  function itemRow(it, i, svc) {
    const placeholder = placeholderFor(it, svc);
    return '<li class="item' + (it.hidden ? ' off' : '') + '" data-i="' + i + '">' +
      '<span class="handle" title="Drag to move" aria-hidden="true">⠿</span>' +
      '<div class="row1"><input class="label" data-f="label" value="' + esc(it.label) + '" aria-label="Item">' +
      '<input class="note" data-f="note" value="' + esc(it.note) + '" placeholder="' + (noteItalic(it) ? 'Song title (optional)' : 'Detail (optional)') + '" aria-label="Detail"></div>' +
      '<div class="tools"><button type="button" class="icon" data-act="hide" title="' + (it.hidden ? 'Show on sheet' : 'Leave off sheet') + '">' + (it.hidden ? '◌' : '●') + '</button>' +
      '<button type="button" class="icon" data-act="remove" title="Remove">✕</button></div>' +
      '<div class="row2"><input class="value' + (looksLinked(it, svc) ? ' linked' : '') + '" data-f="value" value="' + esc(it.value) + '" placeholder="' + esc(placeholder) + '" aria-label="' + (it.kind === 'song' ? 'Song' : 'Person') + '">' +
      (it.kind === 'song' ? '<input class="verses" data-f="verses" value="' + esc(it.verses) + '" placeholder="Verses" aria-label="Verses">' : '') +
      (fromText(it, svc) ? '<span class="from">' + esc(fromText(it, svc)) + '</span>' : '') +
      '</div></li>';
  }

  function partOf(el) { const p = el.closest('[data-p]'); return p ? sheet[Number(p.dataset.p)] : null; }

  function changed(part) {
    part.dirty = true;
    store((s) => s.setItem(DRAFT_PREFIX + part.key, JSON.stringify({ at: Date.now(), order: part.order })));
    renderPreview();
    renderStatus();
  }

  $('#editor').addEventListener('input', (e) => {
    const part = partOf(e.target);
    if (!part) return;
    const li = e.target.closest('.item');
    if (li && e.target.dataset.f) {
      const it = part.order.items[Number(li.dataset.i)];
      it[e.target.dataset.f] = e.target.value;
      if (e.target.dataset.f === 'value') {
        e.target.classList.toggle('linked', looksLinked(it, part.svc));
        const from = li.querySelector('.from');
        if (from) from.textContent = fromText(it, part.svc);
      }
    } else if (e.target.dataset.act === 'cancel') {
      setNote(part, e.target.checked ? cancelNote('', noteOf(part)) : '');
      renderEditor();
    } else if (e.target.dataset.act === 'reason') {
      setNote(part, cancelNote(e.target.value, noteOf(part)));
      e.target.closest('.panel').querySelector('.cancel-note').textContent = noteOf(part);
    } else if (e.target.dataset.team) {
      part.order.team[e.target.dataset.team] = e.target.value;
      part.svc = customSvc(part.svc.date, part.svc.service, part.order.team);
      e.target.closest('.panel').querySelectorAll('.item').forEach((row) => {
        const it = part.order.items[Number(row.dataset.i)];
        if (it.source) row.querySelector('[data-f=value]').placeholder = placeholderFor(it, part.svc);
      });
    } else if (e.target.dataset.act === 'leader') {
      part.order.leader = e.target.value;
    } else if (e.target.dataset.act === 'credits') {
      part.order.credits = e.target.checked;
    } else return;
    changed(part);
  });

  $('#editor').addEventListener('click', async (e) => {
    const b = e.target.closest('button[data-act]');
    if (!b) return;
    const part = partOf(b);
    const li = b.closest('.item');
    const items = part.order.items;
    const act = b.dataset.act;
    if (act === 'remove') items.splice(Number(li.dataset.i), 1);
    else if (act === 'hide') { const it = items[Number(li.dataset.i)]; it.hidden = !it.hidden; }
    else if (act === 'add') {
      const it = PRESETS[b.parentElement.querySelector('select').value]();
      it.id = ++uid;
      // New items go just before the closing song, where specials usually land.
      const closing = items.findIndex((x) => /closing/i.test(x.label));
      items.splice(closing >= 0 ? closing : items.length, 0, it);
    } else if (act === 'reset') {
      if (!confirm('Start this service over from the default order? Your changes to it on this sheet will be lost.')) return;
      const team = part.order.team;
      part.order = freshOrder(part.svc);
      if (part.custom) part.order.team = team;   // keep the names; only the order starts over
      store((s) => s.removeItem(DRAFT_PREFIX + part.key));
    } else if (act === 'default') {
      await saveDefault(part);
      return;
    }
    renderEditor();
    changed(part);
  });

  // ---------- Drag and drop ----------
  let drag = null;
  $('#editor').addEventListener('mousedown', (e) => {
    const handle = e.target.closest('.handle');
    if (handle) handle.closest('.item').draggable = true;
  });
  $('#editor').addEventListener('dragstart', (e) => {
    const li = e.target.closest('.item');
    if (!li) return;
    drag = { part: partOf(li), from: Number(li.dataset.i) };
    li.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', '');
  });
  // The gap the pointer is nearest: before item i, or after the last one (i = number of items).
  function dropGap(list, y) {
    const rows = [...list.querySelectorAll(':scope > .item')];
    const i = rows.findIndex((row) => { const r = row.getBoundingClientRect(); return y < r.top + r.height / 2; });
    return { rows, gap: i < 0 ? rows.length : i };
  }
  const clearDrop = () => document.querySelectorAll('.drop-before, .drop-end').forEach((x) => x.classList.remove('drop-before', 'drop-end'));
  $('#editor').addEventListener('dragover', (e) => {
    const list = e.target.closest('.items');
    if (!drag || !list || partOf(list) !== drag.part) return;
    e.preventDefault();
    clearDrop();
    const { rows, gap } = dropGap(list, e.clientY);
    drag.to = gap;
    if (gap === drag.from || gap === drag.from + 1) return;   // right where it already is
    if (gap < rows.length) rows[gap].classList.add('drop-before');
    else rows[rows.length - 1].classList.add('drop-end');
  });
  $('#editor').addEventListener('drop', (e) => {
    const list = e.target.closest('.items');
    if (!drag || !list || partOf(list) !== drag.part) return;
    e.preventDefault();
    clearDrop();
    const items = drag.part.order.items;
    let to = drag.to === undefined ? dropGap(list, e.clientY).gap : drag.to;
    if (to === drag.from || to === drag.from + 1) { drag = null; return; }
    const [moved] = items.splice(drag.from, 1);
    if (drag.from < to) to--;
    items.splice(to, 0, moved);
    const part = drag.part;
    drag = null;
    renderEditor();
    changed(part);
  });
  $('#editor').addEventListener('dragend', () => {
    document.querySelectorAll('.item').forEach((x) => { x.draggable = false; x.classList.remove('dragging', 'drop-before', 'drop-end'); });
    drag = null;
  });

  // ---------- The half sheet ----------
  function songHtml(value, verses) {
    const s = parseSong(value);
    return '<span class="song">' + (s.isNew ? '<span class="new">NEW</span>' : '') +
      (s.num ? '<span class="num">' + esc(s.num) + '</span>' : '') + esc(s.title) + '</span>' +
      (verses ? '<span class="vv">' + esc(verses) + '</span>' : '');
  }

  function lineHtml(it, svc) {
    const value = shown(it, svc);
    const left = esc(it.label) + (it.note ? ' · ' + (noteItalic(it) ? '<i>' + esc(it.note) + '</i>' : esc(it.note)) : '');
    const right = it.kind === 'song' ? songHtml(value, it.verses) : esc(value);
    return '<div class="ln"><span class="l">' + left + '</span><span class="r">' + right + '</span></div>';
  }

  // Two pairs per line; the second pair's label gets extra space before it.
  function rows(pairs) {
    return pairs.map(([k, v], i) => {
      const cls = i % 2 ? 'k k2' : 'k';
      return k ? '<span class="' + cls + '">' + esc(k) + '</span><span>' + esc(v) + '</span>' : '<span class="' + cls + '"></span><span></span>';
    }).join('') + (pairs.length % 2 ? '<span></span><span></span>' : '');
  }

  function creditsHtml(part) {
    const svc = part.svc;
    const music = [];
    MUSIC.forEach(([role, label]) => { const v = roleValue(svc, role); if (v) music.push([label, v]); });
    // The song leader is shown under the service name instead (leaderOf).
    const accompanists = music.filter(([k]) => k !== 'Leader');
    const singers = [];
    SINGER_ROWS.forEach((row) => {
      const cells = row.map((role) => { const v = roleValue(svc, role); return v ? [SINGER_LABEL[role] || role, v] : [null, '']; });
      if (cells.some(([k]) => k)) singers.push(...cells);
    });
    const media = [];
    MEDIA.forEach(([role, label]) => { const v = roleValue(svc, role); if (v) media.push([label, v]); });
    const groups = [['ACCOMPANISTS', accompanists], ['SINGERS', singers], ['MEDIA', media]].filter(([, list]) => list.length);
    if (!groups.length) return '';
    return '<div class="credits">' +
      groups.map(([h, list]) => '<div class="cg-h">' + h + '</div>' + rows(list)).join('') + '</div>';
  }

  const leaderOf = (part) => roleValue(part.svc, 'Leading') || roleValue(part.svc, 'Song Leading') || part.order.leader || '';

  function headerRight(part) {
    const svc = part.svc;
    const parts = [fmt(svc.date, { month: 'long', day: 'numeric', year: 'numeric' })];
    const time = roleValue(svc, 'Time');
    if (time) parts.push(time);
    const note = noteOf(part);
    if (note) parts.push(note);
    return parts.join(' · ');
  }

  function halfHtml() {
    const body = sheet.map((part) => {
      const svc = part.svc;
      const leader = leaderOf(part);
      if (CANCELLABLE.includes(svc.service) && partOff(part)) {
        return '<section class="svc"><div class="svc-hd"><b>' + esc(SERVICE_LABEL[svc.service] || svc.service) + '</b><span>' +
          esc(fmt(svc.date, { month: 'long', day: 'numeric', year: 'numeric' })) + '</span></div>' +
          '<div class="ln off-note"><span class="l">' + esc(noteOf(part)) + '</span></div></section>';
      }
      return '<section class="svc"><div class="svc-hd"><b>' + esc(SERVICE_LABEL[svc.service] || svc.service) + '</b><span>' + esc(headerRight(part)) + '</span></div>' +
        (leader ? '<div class="lead">Music Leader: ' + esc(leader) + '</div>' : '') +
        part.order.items.filter((it) => prints(it, svc)).map((it) => lineHtml(it, svc)).join('') +
        (part.order.credits !== false ? creditsHtml(part) : '') + '</section>';
    }).join('');
    return '<div class="half-body">' + body + '</div><div class="half-foot"><img src="logo.png" alt="Grace Baptist Church"></div>';
  }

  // Shrink the text a little at a time until everything fits on the half sheet.
  function fit(half) {
    const body = half.querySelector('.half-body');
    let s = 1;
    body.style.setProperty('--s', s);
    while (body.scrollHeight > body.clientHeight + 1 && s > LAYOUTS[layout].min) {
      s = Math.round((s - 0.02) * 100) / 100;
      body.style.setProperty('--s', s);
    }
    return { s, fits: body.scrollHeight <= body.clientHeight + 1 };
  }

  let lastFit = { s: 1, fits: true };
  function renderPreview() {
    const half = $('#half');
    half.className = 'half' + LAYOUTS[layout].cls + (isWednesdaySheet() ? ' wed' : '');
    half.innerHTML = halfHtml();
    lastFit = fit(half);
    $('#fit').innerHTML = !lastFit.fits ? '<span class="fit-warn">Too long to fit. Leave something off.</span>'
      : lastFit.s < 1 ? 'Text shrunk to ' + Math.round(lastFit.s * 100) + '% to fit' : '';
    scalePreview();
  }

  function scalePreview() {
    const wrap = $('#paperWrap');
    const w = LAYOUTS[layout].width * 96;
    const k = Math.min(1, (wrap.clientWidth - 28) / w);
    $('#paperScale').style.transform = 'scale(' + k + ')';
    $('#paperScale').style.height = (LAYOUTS[layout].height * 96 * k) + 'px';
    $('#paperScale').style.width = (w * k) + 'px';
  }
  window.addEventListener('resize', scalePreview);

  const printCopies = () => $('#half').outerHTML.replace(' id="half"', '').repeat(LAYOUTS[layout].copies);
  // Not named print(): a page-level print() replaces window.print and calls itself forever.
  function printSheet() {
    $('#printArea').innerHTML = printCopies();
    window.print();
  }
  $('#printBtn').onclick = printSheet;

  // Save PDF downloads one copy on a page its own size, for emailing. The page is drawn into a
  // picture at about 400 dpi (html2canvas) and put in a PDF (jsPDF), so there's no print dialog.
  function pdfName() {
    // Matches the Orders of Service folder ("2026-10-18_Order of Service"), so the email helper finds it.
    const svc = sheet.length ? sheet[0].svc : null;
    if (!svc) return 'Order of Service';
    if (svc.service === 'Sunday AM' || svc.service === 'Sunday PM') return svc.date + '_Order of Service';
    return svc.date + '_' + svc.service + ' Order of Service';
  }
  const PDF_LIBS = ['https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'];
  const PDF_SCALE = 4;   // 96 px per inch x 4 = about 400 dpi
  let pdfLibs = null;
  function loadPdfLibs() {
    if (!pdfLibs) {
      pdfLibs = Promise.all(PDF_LIBS.map((src) => new Promise((resolve, reject) => {
        const tag = document.createElement('script');
        tag.src = src;
        tag.onload = resolve;
        tag.onerror = () => { pdfLibs = null; reject(new Error('Couldn’t load the PDF tools. Check your connection and try again.')); };
        document.head.appendChild(tag);
      })));
    }
    return pdfLibs;
  }
  // html2canvas ignores CSS filters, so the black logo is made by hand: every pixel black, same transparency.
  let blackLogo = null;
  function blackLogoUrl() {
    if (!blackLogo) {
      blackLogo = new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const c = document.createElement('canvas');
          c.width = img.naturalWidth;
          c.height = img.naturalHeight;
          const g = c.getContext('2d');
          g.drawImage(img, 0, 0);
          const px = g.getImageData(0, 0, c.width, c.height);
          for (let i = 0; i < px.data.length; i += 4) px.data[i] = px.data[i + 1] = px.data[i + 2] = 0;
          g.putImageData(px, 0, 0);
          resolve(c.toDataURL('image/png'));
        };
        img.onerror = () => { blackLogo = null; reject(new Error('Couldn’t load the logo.')); };
        img.src = 'logo.png';
      });
    }
    return blackLogo;
  }
  async function makePdf() {
    await Promise.all([loadPdfLibs(), document.fonts.ready]);
    const L = LAYOUTS[layout];
    // Draw a copy at full size, away from the preview's zoom.
    const holder = document.createElement('div');
    holder.style.cssText = 'position:fixed;left:-20000px;top:0;background:#fff';
    holder.innerHTML = $('#half').outerHTML.replace(' id="half"', '');
    const copy = holder.firstElementChild;
    const logo = copy.querySelector('.half-foot img');
    document.body.appendChild(holder);
    try {
      if (logo) {
        logo.style.filter = 'none';
        logo.src = await blackLogoUrl();
        await logo.decode().catch(() => {});
      }
      const canvas = await window.html2canvas(copy, { scale: PDF_SCALE, backgroundColor: '#ffffff', logging: false });
      const doc = new window.jspdf.jsPDF({ unit: 'in', format: [L.width, L.height], orientation: L.width > L.height ? 'landscape' : 'portrait', compress: true });
      doc.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, L.width, L.height, undefined, 'FAST');
      return doc;
    } finally {
      holder.remove();
    }
  }
  // Saves the PDF straight into Drive: Orders of Service / 2026 / 11_November, where the weekly
  // email looks for it. If that doesn't work, the PDF downloads instead so nothing is lost.
  async function savePdf() {
    const btn = $('#pdfBtn');
    const name = pdfName() + '.pdf';
    let doc = null;
    btn.disabled = true;
    btn.textContent = 'Saving PDF…';
    try {
      doc = await makePdf();
      const res = await withCode('saveOrderPdf', { date: sheet[0].svc.date, name, data: doc.output('datauristring').split(',')[1] });
      if (!res) return;   // the code box was cancelled
      flashStatus('PDF saved to Drive: Orders of Service › ' + res.folder);
    } catch (err) {
      if (doc) {
        doc.save(name);
        alert('Couldn’t save the PDF to Drive (' + err.message + ') It was downloaded instead.');
      } else {
        alert(err.message);
      }
    } finally {
      btn.disabled = false;
      btn.textContent = 'Save PDF';
    }
  }
  function flashStatus(text) {
    $('#status').className = 'status';
    $('#status').textContent = text;
    clearTimeout(flashStatus.timer);
    flashStatus.timer = setTimeout(renderStatus, 6000);
  }
  $('#pdfBtn').onclick = savePdf;
  // Ctrl/Cmd+P prints the same two-up sheet.
  window.addEventListener('beforeprint', () => {
    if (!$('#printArea').innerHTML) $('#printArea').innerHTML = printCopies();
  });
  window.addEventListener('afterprint', () => { $('#printArea').innerHTML = ''; });

  // ---------- Saving ----------
  function renderStatus() {
    const dirty = sheet.some((p) => p.dirty);
    const anySaved = sheet.some((p) => saved.orders[p.key]);
    $('#status').className = 'status' + (dirty ? ' dirty' : '');
    $('#status').textContent = dirty ? 'Unsaved changes (kept on this computer)' : anySaved ? 'Saved' : 'Not saved yet';
    const svc = sheet.length && sheet[0].svc;
    $('#packetLink').href = 'packet.html' + (svc ? '?date=' + svc.date + (svc.service === 'Sunday AM' ? '' : '&service=' + encodeURIComponent(svc.service)) : '');
  }

  function askCode(message) {
    return new Promise((resolve) => {
      const d = $('#codeDialog');
      $('#codeErr').textContent = message || '';
      $('#codeInput').value = '';
      d.showModal();
      $('#codeInput').focus();
      $('#codeCancel').onclick = () => { d.close(); resolve(null); };
      $('#codeForm').onsubmit = (e) => { e.preventDefault(); const v = $('#codeInput').value.trim(); d.close(); resolve(v || null); };
    });
  }

  async function post(body) {
    let res;
    try {
      const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body) });
      res = await r.json();
    } catch (e) {
      throw new Error('Couldn’t reach the Sheet. Check your connection and try again.');
    }
    if (res.status === 'error') throw new Error(res.message);
    return res;
  }

  // Sends one save, asking for the code first if needed and again if it's wrong.
  // Sends one request that needs the code, asking for it first if needed and again if it's wrong.
  async function withCode(action, fields) {
    let code = store((s) => s.getItem(CODE_KEY));
    let message = '';
    for (;;) {
      if (!code) code = await askCode(message);
      if (!code) return null;
      const res = await post(Object.assign({ action, code }, fields));
      if (res.status === 'badcode') { store((s) => s.removeItem(CODE_KEY)); code = null; message = 'That code isn’t right. Try again.'; continue; }
      store((s) => s.setItem(CODE_KEY, code));
      return res;
    }
  }
  const send = async (key, order) => !!(await withCode('saveOrder', { key, order }));

  async function save() {
    const btn = $('#saveBtn');
    btn.disabled = true;
    btn.textContent = 'Saving…';
    try {
      for (const part of sheet) {
        // A Cancelled change goes to the Service Notes row first.
        if (!part.custom && part.order.pendingNote !== undefined) {
          const res = await withCode('setNote', { date: part.svc.date, service: part.svc.service, note: part.order.pendingNote });
          if (!res) return;
          setSheetNote(part.svc, res.note);
          delete part.order.pendingNote;
        }
        const order = clone(part.order);
        order.savedAt = Date.now();
        order.items.forEach((it) => { delete it.id; });
        if (!(await send(part.key, order))) return;
        saved.orders[part.key] = order;
        if (part.moveFrom && part.moveFrom !== part.key) {
          await send(part.moveFrom, null);
          delete saved.orders[part.moveFrom];
        }
        part.moveFrom = null;
        part.dirty = false;
        store((s) => s.removeItem(DRAFT_PREFIX + part.key));
      }
      renderDates();
    } catch (err) {
      alert(err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Save';
      renderStatus();
    }
  }
  $('#saveBtn').onclick = save;

  async function saveDefault(part) {
    const type = templateType(part.svc);
    const name = type === 'One-time' ? 'one-time services (like Christmas Eve)' : SERVICE_LABEL[type];
    if (!confirm('Use this order as the starting point for every new ' + name + ' sheet? Verses and schedule changes are cleared from the default.')) return;
    const items = clone(part.order.items).map((it) => {
      delete it.id;
      if (it.kind === 'song') { it.verses = ''; if (it.source) it.value = ''; }
      return it;
    });
    try {
      if (await send('template|' + type, { items })) {
        saved.templates[type] = { items };
        alert('Saved. New ' + name + ' sheets will start from this order.');
      }
    } catch (err) {
      alert(err.message);
    }
  }

  window.addEventListener('beforeunload', (e) => {
    if (sheet.some((p) => p.dirty)) { e.preventDefault(); e.returnValue = ''; }
  });

  // ---------- Start ----------
  $('#date').onchange = () => openChoice($('#date').value);
  function showLayout(v) {
    layout = v;
    $('#layout').value = v;
    $('#printNote').textContent = 'Prints ' + LAYOUTS[v].note + ' on letter paper (landscape).';
  }
  function setLayout(v) {
    showLayout(v);
    store((s) => s.setItem(layoutKey(), v));
    if (sheet.length) renderPreview();
  }
  $('#layout').onchange = () => setLayout($('#layout').value);
  showLayout(layout);

  async function start() {
    $('#status').textContent = 'Loading…';
    try {
      const [feed, orders] = await Promise.all([
        fetch(API_URL, { cache: 'no-store' }).then((r) => r.json()),
        fetch(API_URL + '?orders=1', { cache: 'no-store' }).then((r) => r.json()),
      ]);
      if (feed.status === 'error') throw new Error(feed.message);
      services = feed.services || [];
      saved = { orders: orders.orders || {}, templates: orders.templates || {} };
    } catch (err) {
      $('#notice').innerHTML = '<p class="msg error">Couldn’t load the schedule: ' + esc(err.message) + '</p>';
      $('#status').textContent = '';
      return;
    }
    renderDates();
    openChoice($('#date').value);
  }
  document.fonts && document.fonts.ready.then(() => { if (sheet.length) renderPreview(); });
  start();
</script>
</body>
</html>
