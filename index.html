<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grace Music Schedule</title>
<meta name="description" content="Who's serving in music and media at Grace Baptist Church, and when.">
<meta name="theme-color" content="#233617">
<meta name="apple-mobile-web-app-title" content="Music">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: #7BAE58;
    --brand-deep: #233617;
    --brand-mid: #4E7A35;
    --bg: #F3F8EF;
    --card: #FFFFFF;
    --ink: #1E2A16;
    --muted: #5B6A50;
    --line: #DCE7D3;
    --tint: #EFF6EA;
    --tint-line: #C6DBB6;
    --seg-on-bg: #233617;
    --seg-on-ink: #FFFFFF;
    --mark-bg: #FFF2CC;
    --mark-ink: #4A3500;
    --out-bg: #FCE4E4;
    --out-ink: #9B1C1C;
    --note-bg: #E3EEFB;
    --note-ink: #0C447C;
    --danger: #B3261E;
    --shadow: 0 1px 2px rgba(35, 54, 23, .06), 0 2px 8px rgba(35, 54, 23, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10160C;
      --card: #1A2414;
      --ink: #E8F0E1;
      --muted: #A3B396;
      --line: #2D3B24;
      --tint: #243319;
      --tint-line: #3A4D2E;
      --seg-on-bg: #7BAE58;
      --seg-on-ink: #10160C;
      --mark-bg: #4A3B12;
      --mark-ink: #FFE7A3;
      --out-bg: #4A1F1F;
      --out-ink: #F7C1C1;
      --note-bg: #0F2A47;
      --note-ink: #B5D4F4;
      --danger: #F2B8B5;
      --shadow: none;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.4 'Poppins', system-ui, -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }

  .top {
    background: var(--brand-deep);
    color: #fff;
    padding: 16px 16px 14px;
    padding-top: max(16px, env(safe-area-inset-top));
    text-align: center;
  }
  .top img { height: 44px; display: block; margin: 0 auto 4px; }
  .top p { margin: 0; font-size: 14px; color: #CFE3C0; letter-spacing: .02em; }

  .bar {
    position: sticky;
    top: 0;
    z-index: 2;
    background: var(--bg);
    padding: 10px 16px 8px;
    border-bottom: 1px solid var(--line);
  }
  .bar-inner { max-width: 560px; margin: 0 auto; }
  .seg {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    background: var(--tint);
    border: 1px solid var(--tint-line);
    border-radius: 12px;
    padding: 3px;
    gap: 3px;
  }
  .seg button {
    border: 0;
    background: transparent;
    border-radius: 9px;
    min-height: 40px;
    font-weight: 600;
    font-size: 14px;
  }
  .seg button[aria-pressed="true"] { background: var(--seg-on-bg); color: var(--seg-on-ink); }

  .filters { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .filters button {
    flex: none;
    border: 1px solid var(--tint-line);
    background: var(--card);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 13px;
    font-weight: 500;
  }
  .filters button[aria-pressed="true"] { background: var(--seg-on-bg); border-color: var(--seg-on-bg); color: var(--seg-on-ink); }

  main { max-width: 560px; margin: 0 auto; padding: 12px 16px 48px; }

  .who label { display: block; font-size: 13px; color: var(--muted); margin: 2px 0 4px; }
  .who-row { display: flex; gap: 8px; }
  .who input {
    flex: 1;
    min-width: 0;
    min-height: 44px;
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    font-size: 16px;
  }
  .who button {
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 10px;
    padding: 0 12px;
    font-size: 14px;
  }
  input:focus, button:focus-visible, summary:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .card-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 14px 8px;
    border-bottom: 1px solid var(--line);
  }
  .card-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .card-head .when { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .badge {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .05em;
    background: var(--tint);
    color: var(--brand-mid);
    border: 1px solid var(--tint-line);
    border-radius: 6px;
    padding: 1px 6px;
    margin-left: 6px;
    vertical-align: 1px;
  }
  @media (prefers-color-scheme: dark) { .badge { color: var(--brand); } }

  .sec { padding: 8px 14px 10px; }
  .sec + .sec { border-top: 1px solid var(--line); }
  .sec h3 {
    margin: 0 0 4px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--brand-mid);
  }
  @media (prefers-color-scheme: dark) { .sec h3 { color: var(--brand); } }
  .grid {
    display: grid;
    grid-template-columns: 7.25rem minmax(0, 1fr);
    column-gap: 12px;
    row-gap: 2px;
    margin: 0;
    font-size: 14px;
  }
  .grid dt { color: var(--muted); font-size: 13px; padding-top: 1px; }
  .grid dd { margin: 0; overflow-wrap: anywhere; }
  .songs { margin: 0; padding: 0; list-style: none; font-size: 14px; }
  .songs li { padding: 1px 0; }
  .songs li.closing { color: var(--muted); }
  .songs li.closing span { color: var(--ink); }
  mark { background: var(--mark-bg); color: var(--mark-ink); border-radius: 4px; padding: 0 3px; font-weight: 600; }

  .mine { list-style: none; margin: 12px 0 0; padding: 0; }
  .mine li { margin-bottom: 8px; }
  .mine .entry {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .mine .row {
    display: grid;
    grid-template-columns: 52px 1fr auto;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 10px 14px;
    border: 0;
    background: none;
    text-align: left;
  }
  .day {
    text-align: center;
    background: var(--tint);
    border: 1px solid var(--tint-line);
    border-radius: 10px;
    padding: 4px 0;
    line-height: 1.1;
  }
  .day b { display: block; font-size: 20px; font-weight: 600; }
  .day small { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .what b { display: block; font-weight: 600; font-size: 15px; }
  .what span { font-size: 13px; color: var(--muted); }
  .what .what-note { display: block; color: var(--note-ink); font-weight: 600; }
  .svc-note {
    padding: 8px 14px;
    background: var(--note-bg);
    color: var(--note-ink);
    font-size: 14px;
    font-weight: 600;
    border-bottom: 1px solid var(--line);
  }
  .chev { color: var(--muted); transition: transform .15s; font-size: 18px; }
  .row[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .mine .card { border: 0; border-top: 1px solid var(--line); border-radius: 0; box-shadow: none; margin: 0; }
  .mine .svc-note { display: none; } /* already shown on the date row */
  .svc-note.is-cancelled { background: var(--out-bg); color: var(--out-ink); }
  .card.cancelled .sec { opacity: .45; }
  .entry.is-cancelled .day { background: var(--line); border-color: transparent; color: var(--muted); }
  .entry.is-cancelled .what b { text-decoration: line-through; color: var(--muted); }
  .entry.is-cancelled .what-note { color: var(--out-ink); }
  .pill-out {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--out-ink);
    background: var(--out-bg);
    border-radius: 6px;
    padding: 1px 6px;
    margin-left: 6px;
    vertical-align: 2px;
  }
  .what .what-change {
    display: inline-block;
    margin-top: 3px;
    font-size: 12px;
    font-weight: 600;
    color: var(--mark-ink);
    background: var(--mark-bg);
    border-radius: 6px;
    padding: 1px 7px;
  }
  .entry.is-out .day { background: var(--out-bg); border-color: transparent; color: var(--out-ink); }
  .entry.is-out .day small { color: var(--out-ink); }

  .acts {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 0 14px 12px;
  }
  .acts .act { flex: 1 1 0; }
  .acts .note + .act { flex: 0 0 auto; }
  .act {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 38px;
    padding: 0 12px;
    border: 1px solid var(--tint-line);
    border-radius: 10px;
    background: var(--card);
    color: var(--ink);
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    text-decoration: none;
  }
  .act.warn { color: var(--out-ink); }
  .act.primary { background: var(--seg-on-bg); border-color: var(--seg-on-bg); color: var(--seg-on-ink); }
  .act:disabled { opacity: .6; cursor: default; }
  .acts .note { font-size: 13px; color: var(--out-ink); font-weight: 500; flex: 1 1 180px; }
  .acts .err { font-size: 13px; color: var(--danger); flex-basis: 100%; }
  .allcal { width: 100%; margin-top: 12px; }

  .overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: rgba(16, 22, 12, .5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .sheet {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border-radius: 16px;
    padding: 18px 18px 14px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
  }
  .sheet h3 { margin: 0 0 6px; font-size: 17px; font-weight: 600; }
  .sheet p { margin: 0 0 16px; font-size: 14px; color: var(--muted); }
  .sheet-buttons { display: flex; justify-content: flex-end; gap: 8px; }
  .mine .card-head { display: none; }

  .month { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin: 16px 2px 6px; }
  .month:first-child { margin-top: 4px; }
  #mineList .month:first-child { margin-top: 14px; }
  .rot-intro { font-size: 13px; color: var(--muted); margin: 4px 2px 10px; }
  #weeks button { flex: 1 1 0; }
  .rot-mine .grid { grid-template-columns: 5.5rem minmax(0, 1fr); }
  .empty { text-align: center; color: var(--muted); padding: 28px 12px; font-size: 14px; }
  .empty b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }
  .foot { text-align: center; font-size: 12px; color: var(--muted); margin-top: 20px; }
  .foot button { border: 0; background: none; color: var(--brand-mid); font-size: 12px; font-weight: 600; padding: 4px; text-decoration: underline; }
  @media (prefers-color-scheme: dark) { .foot button { color: var(--brand); } }
  .error { color: var(--danger); }
</style>
</head>
<body>
  <header class="top">
    <img src="logo.png" alt="Grace Baptist Church">
    <p>Music and Media Schedule</p>
  </header>

  <div class="bar">
    <div class="bar-inner">
      <div class="seg" role="group" aria-label="View">
        <button type="button" id="viewMine" aria-pressed="true">My Dates</button>
        <button type="button" id="viewAll" aria-pressed="false">All Services</button>
        <button type="button" id="viewRot" aria-pressed="false" hidden>Rotation</button>
      </div>
      <div class="filters" id="filters" role="group" aria-label="Service" hidden></div>
      <div class="filters" id="weeks" role="group" aria-label="Week of the month" hidden></div>
    </div>
  </div>

  <main>
    <section id="mine">
      <div class="who">
        <label for="name">Your name</label>
        <div class="who-row">
          <input id="name" list="names" autocomplete="off" autocapitalize="words" placeholder="Start typing your name">
          <button type="button" id="clearName" hidden>Clear</button>
        </div>
        <datalist id="names"></datalist>
      </div>
      <div id="mineList"></div>
    </section>

    <section id="all" hidden></section>

    <section id="rot" hidden></section>

    <p class="foot" id="foot"></p>
  </main>

  <div class="overlay" id="dialog" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <h3 id="dialogTitle"></h3>
      <p id="dialogBody"></p>
      <div class="sheet-buttons">
        <button type="button" class="act" id="dialogCancel">Cancel</button>
        <button type="button" class="act primary" id="dialogOk">OK</button>
      </div>
    </div>
  </div>

<script>
  // The Apps Script web app URL (Deploy > Manage deployments). It stays the
  // same when a new version is deployed. Leave it empty to preview the page
  // with sample.json from this folder.
  const API_URL = 'https://script.google.com/macros/s/AKfycbyN_FOd4twDKmMrDk5l3NqTmKRJrKhIC3kUgkuumCKGoxK_wlkFxZlWevtGUyPtSnPE8Q/exec';
  const NAME_KEY = 'gbc-music-name';
  const VIEW_KEY = 'gbc-music-view';
  const DATA_KEY = 'gbc-music-data';
  const OUT_KEY = 'gbc-music-out';

  // Who "I'll be out" tells (the script emails the Sheet's owner).
  const CONTACT_NAME = 'David Luttrull';
  // Calendar events: start time in church time and length in minutes.
  const CHURCH_TZ = 'America/Indiana/Indianapolis';
  const SERVICE_TIME = {
    'Sunday AM': { h: 10, m: 30, minutes: 90 },
    'Sunday PM': { h: 18, m: 0, minutes: 75 },
    'Wednesday': { h: 19, m: 0, minutes: 60 },
  };
  const LOCATION = 'Grace Baptist Church';
  const PAGE_URL = 'https://gracetoanderson.com/musicschedule';

  const SERVICE_LABEL = { 'Sunday AM': 'Sunday Morning', 'Sunday PM': 'Sunday Evening', 'Wednesday': 'Wednesday Evening' };
  const SERVICE_SHORT = { 'Sunday AM': 'AM', 'Sunday PM': 'PM', 'Wednesday': 'Wed' };
  // Rows in these sections hold song titles and notes, not people.
  const NOT_PEOPLE = ['Songs'];
  const FREE_TEXT_ROLES = ['Offering', 'Special'];
  // The row at the top of each service in the Sheet ("Lord's Supper").
  const SERVICE_NOTES = 'Service Notes';
  const serviceNote = (svc) => (svc.items.find((it) => it.role === SERVICE_NOTES) || {}).value || '';
  // "Cancelled", "Cancelled - snow", "No Regular Evening Service - Harvest Family Night"
  const CANCELLED = /cancel|^\s*no\b.*\bservice/i;
  const isCancelled = (svc) => CANCELLED.test(serviceNote(svc));
  // One-time services (Christmas Eve) have a Time row in the Sheet instead of a fixed time.
  const TIME_ROLE = 'Time';
  const timeText = (svc) => (svc.items.find((it) => it.role === TIME_ROLE) || {}).value || '';
  const serviceName = (svc) => SERVICE_LABEL[svc.service] || svc.service;
  // Not people: these rows describe the service.
  const INFO_ROLES = [SERVICE_NOTES, TIME_ROLE];

  const $ = (sel) => document.querySelector(sel);
  let services = [];
  let rotation = [];          // the regular rotation: { service, section, role, weeks: [5 names] }
  let rotWeek = 0;            // 1-5; set from the coming Sunday when the page opens
  let updated = '';
  let filter = 'All';
  let mine = [];              // My Dates entries, in the order shown
  const openKeys = new Set(); // dates left open, kept open when the list redraws

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function store(fn) {
    try { return fn(window.localStorage); } catch (e) { return null; }
  }

  // ---------- Dates ----------
  function parseDate(key) {
    const [y, m, d] = key.split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  function todayStart() {
    const t = new Date();
    return new Date(t.getFullYear(), t.getMonth(), t.getDate());
  }
  function relDay(key) {
    const days = Math.round((parseDate(key) - todayStart()) / 86400000);
    if (days === 0) return 'Today';
    if (days === 1) return 'Tomorrow';
    if (days === -1) return 'Yesterday';
    if (days > 1 && days < 7) return 'In ' + days + ' days';
    return '';
  }
  const fmt = (key, opts) => parseDate(key).toLocaleDateString('en-US', opts);

  // ---------- Names ----------
  // A cell can hold several people: "Isabel Bott & Eliana Worsham",
  // "Carrie Warner, Amber Foote", "Amber Foote / Becca Luttrull".
  function splitNames(value) {
    return value
      .replace(/[()]/g, ' ')
      .split(/\s*(?:&|,|\/|\+|\band\b)\s*/i)
      .map((s) => s.replace(/\s+/g, ' ').trim())
      .filter(Boolean);
  }
  const norm = (s) => s.toLowerCase().replace(/[.']/g, '').replace(/\s+/g, ' ').trim();

  // "E Foote" and "Eliana W" are how short names get typed into the sheet;
  // count them as the same person when the initial and the other name agree.
  function sameName(token, me) {
    const a = norm(token).split(' ');
    const b = norm(me).split(' ');
    if (a.join(' ') === b.join(' ')) return true;
    if (a.length !== 2 || b.length < 2) return false;
    const first = b[0], last = b[b.length - 1];
    if (a[0].length === 1 && a[0] === first[0] && a[1] === last) return true;
    if (a[1].length === 1 && a[0] === first && a[1] === last[0]) return true;
    return false;
  }

  // The volunteer's name as it's written in this cell ("E Foote"), or [] if
  // they aren't in it. The script uses these to mark the right cells red.
  function matchesIn(item, me) {
    if (!me || NOT_PEOPLE.includes(item.section) || INFO_ROLES.includes(item.role)) return [];
    const tokens = splitNames(item.value);
    const hits = tokens.filter((t) => sameName(t, me));
    if (hits.length || !FREE_TEXT_ROLES.includes(item.role)) return hits;
    // "Men's Quartet (David Luttrull Lead)", "Duet (David L & Jenn L)":
    // look for the name anywhere in the phrase.
    const found = [];
    tokens.forEach((t) => {
      const w = t.split(' ');
      for (let i = 0; i + 1 < w.length; i++) if (sameName(w[i] + ' ' + w[i + 1], me)) found.push(w[i] + ' ' + w[i + 1]);
    });
    return found;
  }

  function allNames() {
    const seen = new Map();
    services.forEach((s) => s.items.forEach((it) => {
      if (NOT_PEOPLE.includes(it.section) || it.section === 'Service' || INFO_ROLES.includes(it.role)) return;
      splitNames(it.value).forEach((n) => {
        // Full names only; "E Foote" style shorthand would clutter the list.
        if (!/^[A-Za-z][A-Za-z'.-]+( [A-Za-z][A-Za-z'.-]+)+$/.test(n)) return;
        if (n.split(' ').some((p) => p.replace('.', '').length === 1)) return;
        if (!seen.has(norm(n))) seen.set(norm(n), n);
      });
    }));
    return [...seen.values()].sort((a, b) => a.localeCompare(b));
  }

  // ---------- Changes from the rotation ----------
  // The Prelude row follows the Piano rotation.
  const ROTATION_ROLE = { Prelude: 'Piano' };
  const weekOfMonth = (key) => Math.ceil(parseDate(key).getDate() / 7);

  // Whether the rotation has the volunteer in this cell that week: true, false,
  // or null for rows the rotation never fills (Offering, Special, one-time
  // services, a rotation row with no names yet).
  function inRotation(svc, item, me) {
    const role = ROTATION_ROLE[item.role] || item.role;
    const r = rotation.find((x) => x.service === svc.service && x.section === item.section && x.role === role);
    if (!r || !r.weeks.some(Boolean)) return null;
    const usual = r.weeks[weekOfMonth(svc.date) - 1] || '';
    return splitNames(usual).some((t) => sameName(t, me));
  }

  // "Not your usual week", or "Synth: not your usual week" when only some of
  // the day's rotation roles changed.
  function changeText(x) {
    if (!x.changed.length) return '';
    return x.changed.length === x.tracked.length ? 'Not your usual week' : x.changed.join(', ') + ': not your usual week';
  }

  // ---------- Rendering ----------
  function highlight(value, me) {
    if (!me) return esc(value);
    const parts = value.split(/(\s*(?:&|,|\/|\+)\s*)/);
    return parts.map((p) => (splitNames(p).some((t) => sameName(t, me)) ? '<mark>' + esc(p) + '</mark>' : esc(p))).join('');
  }

  function roleLabel(item) {
    if (item.section === 'Congregational Singers') return item.section + ' ' + item.role;
    if (item.role === 'Leading') return 'Leading Singing';
    if (item.role === 'Special') return 'Special: ' + item.value;
    return item.role;
  }

  function serviceBody(svc, me) {
    const groups = [];
    svc.items.forEach((it) => {
      if (INFO_ROLES.includes(it.role)) return;
      let g = groups[groups.length - 1];
      if (!g || g.section !== it.section) groups.push(g = { section: it.section, items: [] });
      g.items.push(it);
    });
    if (!groups.length) return '<div class="sec"><p class="empty" style="padding:8px 0">Nothing scheduled yet.</p></div>';
    return groups.map((g) => {
      let body;
      if (g.section === 'Songs') {
        body = '<ul class="songs">' + g.items.map((it) => it.role === 'Closing'
          ? '<li class="closing">Closing: <span>' + esc(it.value) + '</span></li>'
          : '<li>' + esc(it.value) + '</li>').join('') + '</ul>';
      } else {
        body = '<dl class="grid">' + g.items.map((it) =>
          '<dt>' + esc(it.role) + '</dt><dd>' + highlight(it.value, me) + '</dd>').join('') + '</dl>';
      }
      return '<div class="sec"><h3>' + esc(g.section) + '</h3>' + body + '</div>';
    }).join('');
  }

  function serviceCard(svc, me, isNext) {
    const rel = relDay(svc.date);
    const off = isCancelled(svc);
    return '<article class="card' + (off ? ' cancelled' : '') + '">' +
      '<div class="card-head"><h2>' + esc(fmt(svc.date, { weekday: 'short', month: 'short', day: 'numeric' })) +
      ' &middot; ' + esc(SERVICE_SHORT[svc.service] || svc.service) + (timeText(svc) ? ' &middot; ' + esc(timeText(svc)) : '') +
      (isNext ? '<span class="badge">Next</span>' : '') + '</h2>' +
      '<span class="when">' + esc(rel) + '</span></div>' +
      (serviceNote(svc) ? '<div class="svc-note' + (off ? ' is-cancelled' : '') + '">' + esc(serviceNote(svc)) + '</div>' : '') +
      serviceBody(svc, me) + '</article>';
  }

  function renderAll() {
    const me = currentName();
    const list = services.filter((s) => filter === 'All' || s.service === filter);
    if (!list.length) {
      $('#all').innerHTML = '<p class="empty"><b>Nothing scheduled yet</b>Check back after the next schedule is posted.</p>';
      return;
    }
    let html = '', month = '';
    list.forEach((s, i) => {
      const m = fmt(s.date, { month: 'long', year: 'numeric' });
      if (m !== month) { html += '<div class="month">' + esc(m) + '</div>'; month = m; }
      html += serviceCard(s, me, s === services[0]);
    });
    $('#all').innerHTML = html;
  }

  function renderMine() {
    const me = currentName();
    $('#clearName').hidden = !me;
    if (!me) {
      $('#mineList').innerHTML = services.length
        ? '<p class="empty"><b>See just your dates</b>Type your name above, or pick it from the list.</p>'
        : '';
      return;
    }
    mine = services.map((s) => {
      const hits = s.items.map((it) => ({ it, m: matchesIn(it, me) })).filter((h) => h.m.length);
      const roles = [...new Set(hits.map((h) => roleLabel(h.it)))];
      const checked = hits.map((h) => ({ role: roleLabel(h.it), usual: inRotation(s, h.it, me) })).filter((c) => c.usual !== null);
      const tracked = [...new Set(checked.map((c) => c.role))];
      const changed = tracked.filter((r) => !checked.some((c) => c.role === r && c.usual));
      return { s, roles, tracked, changed, matches: [...new Set(hits.flatMap((h) => h.m))] };
    }).filter((x) => x.roles.length);
    if (!mine.length) {
      $('#mineList').innerHTML = '<p class="empty"><b>No dates found for ' + esc(me) + '</b>' +
        'Check the spelling, or look under All Services.</p>';
      return;
    }
    let html = '<button type="button" class="act allcal" data-act="ics">Add all my dates to my calendar</button>';
    let month = '';
    html += '<ul class="mine">';
    mine.forEach((x, i) => {
      const { s, roles } = x;
      const m = fmt(s.date, { month: 'long', year: 'numeric' });
      if (m !== month) { html += '</ul><div class="month">' + esc(m) + '</div><ul class="mine">'; month = m; }
      const rel = relDay(s.date);
      const key = outKey(s, me);
      const off = isCancelled(s);
      const out = !off && isOut(key);
      const open = openKeys.has(key);
      html += '<li class="entry' + (out ? ' is-out' : '') + (off ? ' is-cancelled' : '') + '" data-key="' + esc(key) + '">' +
        '<button type="button" class="row" data-act="toggle" aria-expanded="' + open + '">' +
        '<div class="day"><b>' + parseDate(s.date).getDate() + '</b><small>' + esc(fmt(s.date, { weekday: 'short' })) + '</small></div>' +
        '<div class="what"><b>' + esc(roles.join(', ')) + (out ? '<span class="pill-out">Out</span>' : '') + '</b><span>' +
        esc(serviceName(s)) + (timeText(s) ? ' &middot; ' + esc(timeText(s)) : '') + (rel ? ' &middot; ' + esc(rel) : '') + '</span>' +
        (serviceNote(s) ? '<span class="what-note">' + esc(serviceNote(s)) + '</span>' : '') +
        (changeText(x) && !off ? '<span class="what-change">' + esc(changeText(x)) + '</span>' : '') + '</div>' +
        '<span class="chev" aria-hidden="true">&rsaquo;</span></button>' +
        (off ? '' : actions(i, out)) +
        '<div class="full"' + (open ? '' : ' hidden') + '>' + serviceCard(s, me, false) + '</div></li>';
    });
    html += '</ul>';
    $('#mineList').innerHTML = html.replace('<ul class="mine"></ul>', '');
  }

  function actions(i, out) {
    const btns = out
      ? '<span class="note">You told ' + esc(CONTACT_NAME) + ' you’ll be out.</span>' +
        '<button type="button" class="act" data-act="undo" data-i="' + i + '">Undo</button>'
      : (eventFor(mine[i]) ? '<a class="act" href="' + esc(googleUrl(eventFor(mine[i]))) + '" target="_blank" rel="noopener">Add to Calendar</a>' : '') +
        '<button type="button" class="act warn" data-act="out" data-i="' + i + '">I’ll be out</button>';
    return '<div class="acts">' + btns + '</div>';
  }

  function renderFilters() {
    const others = [...new Set(services.map((s) => s.service))].filter((k) => !SERVICE_LABEL[k]);
    const kinds = ['All', ...Object.keys(SERVICE_LABEL).filter((k) => services.some((s) => s.service === k)), ...others];
    $('#filters').innerHTML = kinds.map((k) =>
      '<button type="button" data-k="' + esc(k) + '" aria-pressed="' + (k === filter) + '">' + esc(k) + '</button>').join('');
  }

  function renderFoot(msg, isError) {
    const when = updated ? new Date(updated).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
    $('#foot').innerHTML = (msg ? '<span class="' + (isError ? 'error' : '') + '">' + esc(msg) + '</span><br>' : '') +
      (when ? 'Updated ' + esc(when) + ' ' : '') + '<button type="button" id="refresh">Refresh</button>';
    $('#refresh').onclick = load;
  }

  // ---------- Rotation ----------
  const ORDINAL = ['1st', '2nd', '3rd', '4th', '5th'];
  const weekDay = (service) => (service === 'Wednesday' ? 'Wednesday' : 'Sunday');

  // Which week of the month the coming Sunday falls in (today, if it's Sunday).
  function comingWeek() {
    const d = todayStart();
    d.setDate(d.getDate() + ((7 - d.getDay()) % 7));
    return Math.ceil(d.getDate() / 7);
  }

  function renderWeeks() {
    $('#weeks').innerHTML = ORDINAL.map((o, i) =>
      '<button type="button" data-w="' + (i + 1) + '" aria-pressed="' + (i + 1 === rotWeek) + '" aria-label="' + o + ' week of the month">' + o + '</button>').join('');
  }

  // "Your regular spots": every week of the rotation the volunteer is in.
  function rotationMine(me) {
    if (!me) return '<p class="rot-intro">Type your name under My Dates to see your regular spots here.</p>';
    const rows = ORDINAL.map((o, w) => {
      const spots = rotation
        .map((r) => ({ section: r.section, role: r.role, value: r.weeks[w] || '', service: r.service }))
        .filter((it) => matchesIn(it, me).length)
        .map((it) => roleLabel(it) + ' (' + it.service + ')');
      return spots.length ? '<dt>' + o + ' week</dt><dd>' + esc(spots.join(', ')) + '</dd>' : '';
    }).join('');
    return '<article class="card rot-mine"><div class="card-head"><h2>Your regular spots</h2></div>' +
      '<div class="sec">' + (rows ? '<dl class="grid">' + rows + '</dl>'
        : '<p class="rot-intro" style="margin:0">' + esc(me) + ' isn’t in the regular rotation.</p>') + '</div></article>';
  }

  function renderRotation() {
    const me = currentName();
    const w = rotWeek - 1;
    const byService = [];
    rotation.forEach((r) => {
      let g = byService.find((x) => x.service === r.service);
      if (!g) byService.push(g = { service: r.service, items: [] });
      if (r.weeks[w]) g.items.push({ section: r.section, role: r.role, value: r.weeks[w] });
    });
    $('#rot').innerHTML =
      '<p class="rot-intro">The usual lineup for the ' + ORDINAL[w] + ' week of the month. Pick a week above. Swaps and subs show up in My Dates and All Services.</p>' +
      rotationMine(me) +
      byService.map((g) => '<article class="card"><div class="card-head"><h2>' + esc(SERVICE_LABEL[g.service] || g.service) + '</h2>' +
        '<span class="when">' + ORDINAL[w] + ' ' + weekDay(g.service) + '</span></div>' + serviceBody(g, me) + '</article>').join('');
  }

  function render() {
    const names = allNames();
    $('#names').innerHTML = names.map((n) => '<option value="' + esc(n) + '">').join('');
    renderFilters();
    renderMine();
    renderAll();
    $('#viewRot').hidden = !rotation.length;
    if (rotation.length) { renderWeeks(); renderRotation(); }
  }

  // ---------- Calendar ----------
  // Milliseconds church time is ahead of UTC at instant t (negative in Indiana).
  function tzOffset(t) {
    const p = {};
    new Intl.DateTimeFormat('en-US', {
      timeZone: CHURCH_TZ, hourCycle: 'h23', year: 'numeric', month: 'numeric', day: 'numeric',
      hour: 'numeric', minute: 'numeric', second: 'numeric',
    }).formatToParts(new Date(t)).forEach((x) => { p[x.type] = x.value; });
    return Date.UTC(+p.year, p.month - 1, +p.day, +p.hour, +p.minute, +p.second) - t;
  }
  // A clock time at church on a given date, whatever time zone the phone is in.
  function churchTime(dateKey, h, m) {
    const [y, mo, d] = dateKey.split('-').map(Number);
    const wall = Date.UTC(y, mo - 1, d, h, m);
    let t = wall - tzOffset(wall);
    t = wall - tzOffset(t); // second pass covers the daylight-saving change
    return new Date(t);
  }
  const stamp = (d) => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');

  // "6:00 PM", "6 pm", "6:00-7:15 PM" -> { h, m, minutes }, or null if there's no time.
  function parseTime(text) {
    const found = [...String(text).matchAll(/(\d{1,2})(?::(\d{2}))?\s*([ap])?\.?\s*m?\.?/gi)].slice(0, 2);
    if (!found.length || +found[0][1] > 12) return null;
    const half = found.map((f) => (f[3] || '').toLowerCase());
    const fallback = half[half.length - 1] || half[0];
    const toMin = (f, ap) => {
      const h = +f[1] % 12;
      const pm = (ap || fallback || (h >= 1 && h <= 9 ? 'p' : 'a')) === 'p';
      return (h + (pm ? 12 : 0)) * 60 + +(f[2] || 0);
    };
    const start = toMin(found[0], half[0]);
    const end = found[1] ? toMin(found[1], half[1]) : 0;
    return { h: Math.floor(start / 60), m: start % 60, minutes: end > start ? end - start : 60 };
  }
  const timeFor = (svc) => SERVICE_TIME[svc.service] || parseTime(timeText(svc));

  // null when the service has no time yet (a one-time service with its Time row blank).
  function eventFor(x) {
    const t = timeFor(x.s);
    if (!t) return null;
    const start = churchTime(x.s.date, t.h, t.m);
    return {
      uid: x.s.date + '-' + x.s.service.replace(/\W+/g, '').toLowerCase() + '-' + norm(currentName()).replace(/\W+/g, '-') + '@grace-music',
      title: x.roles.join(', ') + ' · ' + serviceName(x.s) + (serviceNote(x.s) ? ' · ' + serviceNote(x.s) : ''),
      start,
      end: new Date(start.getTime() + t.minutes * 60000),
      details: 'Grace Baptist Church music and media schedule:\n' + PAGE_URL,
    };
  }

  function googleUrl(ev) {
    return 'https://calendar.google.com/calendar/render?action=TEMPLATE' +
      '&text=' + encodeURIComponent(ev.title) +
      '&dates=' + stamp(ev.start) + '/' + stamp(ev.end) +
      '&details=' + encodeURIComponent(ev.details) +
      '&location=' + encodeURIComponent(LOCATION);
  }

  function icsText(list) {
    const txt = (v) => String(v).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
    // Calendar files want lines of 75 characters or fewer, continued with a space.
    const fold = (line) => line.length <= 70 ? line : line.match(/.{1,70}/g).join('\r\n ');
    const now = stamp(new Date());
    const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Grace Baptist Church//Music Schedule//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'];
    list.forEach((x) => {
      const ev = eventFor(x);
      if (!ev) return;
      lines.push('BEGIN:VEVENT', 'UID:' + ev.uid, 'DTSTAMP:' + now, 'DTSTART:' + stamp(ev.start), 'DTEND:' + stamp(ev.end),
        'SUMMARY:' + txt(ev.title), 'DESCRIPTION:' + txt(ev.details), 'LOCATION:' + txt(LOCATION), 'END:VEVENT');
    });
    lines.push('END:VCALENDAR');
    return lines.map(fold).join('\r\n') + '\r\n';
  }

  function downloadIcs(list) {
    const blob = new Blob([icsText(list)], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'grace-music-schedule.ics';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
  }

  // ---------- "I'll be out" ----------
  const outKey = (s, me) => s.date + '|' + s.service + '|' + norm(me);
  function outMap() {
    try { return JSON.parse(store((s) => s.getItem(OUT_KEY)) || '{}') || {}; } catch (e) { return {}; }
  }
  const isOut = (key) => !!outMap()[key];
  function setOut(key, out) {
    const map = outMap();
    if (out) map[key] = Date.now(); else delete map[key];
    store((s) => s.setItem(OUT_KEY, JSON.stringify(map)));
  }

  // POST is sent as plain text with no cookies, so there's no CORS preflight
  // and no Google login involved (the same as the attendance page).
  async function post(body) {
    let res;
    try {
      const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body) });
      res = await r.json();
    } catch (e) {
      throw new Error('Couldn’t reach the schedule. Check your connection and try again.');
    }
    if (res.status !== 'ok') throw new Error(res.message || 'Something went wrong. Try again.');
    return res;
  }

  function dialog({ title, body, ok, cancel = 'Cancel' }) {
    return new Promise((resolve) => {
      $('#dialogTitle').textContent = title;
      $('#dialogBody').textContent = body;
      $('#dialogOk').textContent = ok;
      $('#dialogCancel').textContent = cancel;
      $('#dialog').hidden = false;
      $('#dialogOk').focus();
      const done = (v) => {
        $('#dialog').hidden = true;
        $('#dialogOk').onclick = $('#dialogCancel').onclick = $('#dialog').onclick = null;
        document.removeEventListener('keydown', onKey);
        resolve(v);
      };
      const onKey = (e) => { if (e.key === 'Escape') done(false); };
      document.addEventListener('keydown', onKey);
      $('#dialogOk').onclick = () => done(true);
      $('#dialogCancel').onclick = () => done(false);
      $('#dialog').onclick = (e) => { if (e.target === $('#dialog')) done(false); };
    });
  }

  async function onMineClick(e) {
    const b = e.target.closest('button[data-act]');
    if (!b) return;
    if (b.dataset.act === 'toggle') {
      const li = b.closest('.entry');
      const open = b.getAttribute('aria-expanded') !== 'true';
      b.setAttribute('aria-expanded', open);
      li.querySelector('.full').hidden = !open;
      open ? openKeys.add(li.dataset.key) : openKeys.delete(li.dataset.key);
      return;
    }
    const me = currentName();
    if (b.dataset.act === 'ics') {
      downloadIcs(mine.filter((x) => !isCancelled(x.s) && !isOut(outKey(x.s, me))));
      return;
    }
    const x = mine[Number(b.dataset.i)];
    if (!x) return;
    const going = b.dataset.act === 'out';
    const when = serviceName(x.s) + ', ' + fmt(x.s.date, { month: 'short', day: 'numeric' });
    if (going) {
      const ok = await dialog({
        title: 'Out for ' + when + '?',
        body: 'This lets ' + CONTACT_NAME + ' know you can’t serve (' + x.roles.join(', ') + ') and find a sub.',
        ok: 'I’ll be out',
      });
      if (!ok) return;
    }
    const label = b.textContent;
    b.disabled = true;
    b.textContent = going ? 'Sending…' : 'Undoing…';
    const bar = b.closest('.acts');
    const old = bar.querySelector('.err');
    if (old) old.remove();
    try {
      await post({ action: going ? 'out' : 'undo', name: me, date: x.s.date, service: x.s.service, matches: x.matches });
      const key = outKey(x.s, me);
      setOut(key, going);
      openKeys.add(key);
      renderMine();
    } catch (err) {
      b.disabled = false;
      b.textContent = label;
      bar.insertAdjacentHTML('beforeend', '<span class="err">' + esc(err.message) + '</span>');
    }
  }

  // ---------- State ----------
  function currentName() { return $('#name').value.trim(); }

  function setView(v) {
    // Until the rotation has loaded, show My Dates but remember the choice.
    const shown = v === 'rot' && !rotation.length ? 'mine' : v;
    [['mine', '#viewMine', '#mine'], ['all', '#viewAll', '#all'], ['rot', '#viewRot', '#rot']].forEach(([key, btn, sec]) => {
      $(btn).setAttribute('aria-pressed', shown === key);
      $(sec).hidden = shown !== key;
    });
    $('#filters').hidden = shown !== 'all';
    $('#weeks').hidden = shown !== 'rot';
    view = v;
    store((s) => s.setItem(VIEW_KEY, v));
  }

  async function load() {
    if (!API_URL && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
      renderFoot('The schedule isn’t connected yet. Check back soon.');
      return;
    }
    renderFoot('Loading…');
    try {
      const r = await fetch(API_URL || 'sample.json', { cache: 'no-store' });
      const res = await r.json();
      if (res.status === 'error') throw new Error(res.message);
      services = res.services || [];
      rotation = res.rotation || [];
      updated = res.updated || '';
      store((s) => s.setItem(DATA_KEY, JSON.stringify(res)));
      render();
      setView(view);
      renderFoot('');
    } catch (e) {
      renderFoot(services.length
        ? 'Couldn’t reach the schedule, so this may be out of date.'
        : 'Couldn’t load the schedule. Check your connection and refresh.', true);
    }
  }

  $('#mineList').addEventListener('click', onMineClick);
  $('#viewMine').onclick = () => setView('mine');
  $('#viewAll').onclick = () => setView('all');
  $('#viewRot').onclick = () => setView('rot');
  $('#weeks').onclick = (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    rotWeek = Number(b.dataset.w);
    renderWeeks();
    renderRotation();
  };
  $('#filters').onclick = (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    filter = b.dataset.k;
    renderFilters();
    renderAll();
  };
  $('#name').addEventListener('input', () => {
    store((s) => s.setItem(NAME_KEY, currentName()));
    renderMine();
    renderAll();
    if (rotation.length) renderRotation();
  });
  $('#clearName').onclick = () => {
    $('#name').value = '';
    store((s) => s.removeItem(NAME_KEY));
    renderMine();
    renderAll();
    $('#name').focus();
  };

  // Show the last copy right away, then fetch a fresh one.
  $('#name').value = store((s) => s.getItem(NAME_KEY)) || '';
  rotWeek = comingWeek();
  let view = store((s) => s.getItem(VIEW_KEY)) || 'mine';
  try {
    const cached = JSON.parse(store((s) => s.getItem(DATA_KEY)) || 'null');
    if (cached && cached.services) {
      services = cached.services;
      rotation = cached.rotation || [];
      updated = cached.updated || '';
      render();
    }
  } catch (e) { /* ignore a bad cache */ }
  setView(view);
  load();
</script>
</body>
</html>
